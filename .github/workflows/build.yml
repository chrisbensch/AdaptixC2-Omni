name: build
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC — catches upstream submodule drift and patch decay.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker compose --profile build build
      - name: Smoke-test the runtime image
        # Mirrors the hardened posture from docker-compose.yml so CI catches
        # regressions in privilege reduction: cap_drop=ALL with only the four
        # caps the entrypoint + listeners genuinely need, and no-new-privileges.
        # read_only stays off here (override with ADAPTIX_READ_ONLY=true): payload
        # generation is offloaded to the kharon/nax sidecars, so the server itself
        # does not compile anything, but we leave a writable rootfs to tolerate any
        # stray startup write. Healthcheck reaching `healthy` implies the server bound 4321
        # successfully as the unprivileged user.
        run: |
          mkdir -p data
          docker run -d --name omni-smoke -p 4321:4321 \
              -v "$PWD/data:/app/data" \
              --cap-drop ALL \
              --cap-add CHOWN \
              --cap-add SETUID \
              --cap-add SETGID \
              --cap-add NET_BIND_SERVICE \
              --security-opt no-new-privileges:true \
              -e ADAPTIX_TEAMSERVER_PASSWORD=ci-smoke-pw \
              adaptixc2-omni:latest
          for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' omni-smoke 2>/dev/null || echo none)
              echo "[$i] health=$status"
              [ "$status" = "healthy" ] && break
              sleep 3
          done
          if [ "$status" != "healthy" ]; then
              echo "--- docker logs ---"
              docker logs omni-smoke
              exit 1
          fi
          # Privilege-reduction assertion: PID 1 in the container must be the
          # server running as the unprivileged `adaptix` (UID 10001), not root.
          # Catches regressions like a dropped `exec gosu` in the entrypoint.
          uid=$(docker exec omni-smoke awk '/^Uid:/ {print $2; exit}' /proc/1/status)
          echo "PID 1 UID=$uid"
          if [ "$uid" != "10001" ]; then
              echo "::error::expected PID 1 to run as UID 10001 (adaptix), got '$uid'"
              docker exec omni-smoke ps -o user,uid,pid,cmd -ax || true
              exit 1
          fi
          # Fingerprint-reduction assertion: the 404 page and the rendered profile
          # must not contain framework-identifying strings. Catches regressions
          # like a missed COPY override or a profile template revert.
          if docker exec omni-smoke grep -q AdaptixC2 /app/404page.html; then
              echo "::error::/app/404page.html still contains 'AdaptixC2' — Dockerfile COPY override missing?"
              docker exec omni-smoke cat /app/404page.html
              exit 1
          fi
          if docker exec omni-smoke grep -qE '^[[:space:]]*Server:[[:space:]]*"AdaptixC2"' /app/data/profile.yaml; then
              echo "::error::/app/data/profile.yaml still advertises Server: AdaptixC2"
              exit 1
          fi
          if docker exec omni-smoke grep -q '^[[:space:]]*Adaptix-Version:' /app/data/profile.yaml; then
              echo "::error::/app/data/profile.yaml still includes the Adaptix-Version fingerprint header"
              exit 1
          fi
      - name: Build Nax builder sidecar image
        timeout-minutes: 25
        # Verifies the pinned NaX source + cross-toolchain + mingw/objcopy patches
        # land on BOTH arches (CI runs amd64 + arm64). The objcopy fix is the thing
        # most likely to decay differently per-arch: on arm64 the default `objcopy`
        # is an ARM triple that cannot read x86-64 PE files, so the loader/beacon
        # .bin comes out 0 bytes unless the patch points at x86_64-w64-mingw32-objcopy.
        run: docker build -f Dockerfile.nax-builder -t adaptixc2-omni-nax-builder:${{ matrix.runner }} .
      - name: Smoke-test the Nax builder sidecar end-to-end
        timeout-minutes: 20
        # Drives a real build through the builder's unix socket exactly like the
        # teamserver agent does: reads Config.h + Config_sleepmask.h from the pinned
        # tree, synthesizes the one header it lacks (Config_profile.h), and builds.
        # This proves socket comms + writeConfigHeaders + the mingw/objcopy fix all
        # produce a non-empty payload on THIS arch — closing the gap where that was
        # only validated locally. The smoke client is pure Go (it dials the socket;
        # the builder does the compile), so build + run it inside a golang container
        # that shares the builder's /run/nax socket dir. The builder runs as root here
        # (a build-correctness probe, not a privilege-model test — that's the step
        # above this job and the runtime smoke test cover) so it can create its socket
        # in the shared dir regardless of volume ownership.
        run: |
          set -e
          # Fresh dirs each run: a stale socket file from a crashed prior run would
          # otherwise make the -S check report 'up' prematurely.
          rm -rf "$PWD/.ci-nax-sock" "$PWD/.ci-nax-src"
          mkdir -p "$PWD/.ci-nax-sock" "$PWD/.ci-nax-src"
          # Copy the pinned NaX tree OUT of the freshly built image, so this smoke test
          # exercises exactly what the committed image ships (not host working-tree state).
          cid=$(docker create adaptixc2-omni-nax-builder:${{ matrix.runner }})
          docker cp "$cid:/nax/." "$PWD/.ci-nax-src/"
          docker rm "$cid" >/dev/null
          # Start the builder; share a writable /run/nax (socket) + /nax (source tree).
          docker run -d --name nax-builder \
            -v "$PWD/.ci-nax-sock:/run/nax" \
            -v "$PWD/.ci-nax-src:/nax" \
            -u root \
            adaptixc2-omni-nax-builder:${{ matrix.runner }}
          # Wait for the socket to appear (the worker listens immediately).
          up=0
          for i in $(seq 1 30); do
            if docker exec nax-builder test -S /run/nax/builder.sock 2>/dev/null; then
              echo "[+] builder socket up after $i check(s)"; up=1; break
            fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "::error::builder socket never appeared on /run/nax"
            docker logs nax-builder
            exit 1
          fi
          # Build the smoke client for linux inside a golang container, then run it
          # sharing BOTH /run/nax (to dial the socket) and /nax (for Config.h etc.).
          docker run --rm \
            -v "$PWD/sidecar/nax-builder:/src" \
            -v "$PWD/.ci-nax-sock:/run/nax" \
            -v "$PWD/.ci-nax-src:/nax" \
            -e NAX_SRC=/nax \
            -e NAX_BUILDER_SOCK=/run/nax/builder.sock \
            golang:1.25.14-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437 \
            bash -c 'cd /src && go build -o /smoke ./cmd/smoke && /smoke'
          docker rm -f nax-builder >/dev/null
      - name: Build kharon-builder sidecar image
        timeout-minutes: 25
        # Verifies the pinned Kharon source + cross-toolchain + mingw/objcopy patches
        # land on BOTH arches. The arm64 objcopy fix (patches/kharon-beacon-objcopy.patch)
        # is the thing most likely to decay differently per-arch: on arm64 the default
        # `objcopy` is an ARM triple that cannot read x86-64 PE files, so the beacon
        # .bin comes out 0 bytes unless the patch points at x86_64-w64-mingw32-objcopy.
        run: docker build -f Dockerfile.kharon-builder -t adaptixc2-omni-kharon-builder:${{ matrix.runner }} .
      - name: Smoke-test the Kharon builder sidecar end-to-end
        timeout-minutes: 20
        # Drives a real PIC beacon (bin) build then a loader (exe) build through the
        # builder's unix socket exactly like the teamserver agent does. The smoke
        # client is pure Go (it dials the socket); the builder does the mingw/nasm/
        # objcopy compile, so build + run it inside a golang container that shares the
        # builder's /run/kharon socket dir and /app/kharon source tree. The builder runs
        # as root here (a build-correctness probe, not a privilege-model test — that is
        # covered by the runtime smoke and the build job above) so it can create its
        # socket in the shared dir regardless of volume ownership.
        run: |
          set -e
          # Fresh dirs each run: a stale socket file from a crashed prior run would
          # otherwise make the -S check report 'up' prematurely.
          rm -rf "$PWD/.ci-kharon-sock" "$PWD/.ci-kharon-src"
          mkdir -p "$PWD/.ci-kharon-sock" "$PWD/.ci-kharon-src"
          # Copy the pinned Kharon tree OUT of the freshly built image, so this smoke
          # test exercises exactly what the committed image ships (not host state).
          cid=$(docker create adaptixc2-omni-kharon-builder:${{ matrix.runner }})
          docker cp "$cid:/app/kharon/." "$PWD/.ci-kharon-src/"
          docker rm "$cid" >/dev/null
          # Start the builder; share a writable /run/kharon (socket) + /app/kharon (tree).
          docker run -d --name kharon-builder 
            -v "$PWD/.ci-kharon-sock:/run/kharon" 
            -v "$PWD/.ci-kharon-src:/app/kharon" 
            -u root 
            adaptixc2-omni-kharon-builder:${{ matrix.runner }}
          # Wait for the socket to appear (the worker listens immediately).
          up=0
          for i in $(seq 1 30); do
            if docker exec kharon-builder test -S /run/kharon/builder.sock 2>/dev/null; then
              echo "[+] builder socket up after $i check(s)"; up=1; break
            fi
            sleep 2
          done
          if [ "$up" != "1" ]; then
            echo "::error::builder socket never appeared on /run/kharon"
            docker logs kharon-builder
            exit 1
          fi
          # Build the smoke client for linux inside a golang container, then run it
          # sharing BOTH /run/kharon (to dial the socket) and /app/kharon (source tree).
          docker run --rm 
            -v "$PWD/sidecar/kharon-builder:/src" 
            -v "$PWD/.ci-kharon-sock:/run/kharon" 
            -v "$PWD/.ci-kharon-src:/app/kharon" 
            -e KHARON_SRC=/app/kharon 
            -e KHARON_BUILDER_SOCK=/run/kharon/builder.sock 
            golang:1.25.14-bookworm@sha256:3b4a11519ad929d1e1d261a12cff056f0c85b735253d7d861346b9c6f8b36437 
            bash -c 'cd /src && go build -o /smoke ./cmd/smoke && /smoke'
          docker rm -f kharon-builder >/dev/null
      - name: Vulnerability scan (Trivy)
        # Fail the build on any CRITICAL or HIGH severity CVE that has a fix
        # available. `ignore-unfixed` excludes Debian unfix-yet packages so CI
        # only blocks on things we can actually act on (bump base image digest
        # or apt package). Runs after the smoke test so a healthy image gets
        # scanned; if smoke fails the image isn't worth scanning anyway.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'adaptixc2-omni:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
      - name: Generate SBOM (Trivy, CycloneDX)
        # Per-arch artifact uploaded below. Audit/compliance use; not consumed
        # by anything in CI today.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'adaptixc2-omni:latest'
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.runner }}.cyclonedx.json'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.runner }}
          path: sbom-${{ matrix.runner }}.cyclonedx.json
          retention-days: 30
      - name: Tear down
        if: always()
        run: docker rm -f omni-smoke 2>/dev/null || true
