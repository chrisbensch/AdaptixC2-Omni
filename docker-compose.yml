name: adaptixc2-omni

# Build context is this directory so the Dockerfile can COPY all four sibling repos.
# Server image and runtime build for the host architecture (no platform pin), so
# Apple Silicon hosts produce arm64 images natively without QEMU emulation. Windows
# artifacts inside the image are still cross-compiled to x86/x64 PE regardless of
# host arch. To force a specific arch, set DOCKER_DEFAULT_PLATFORM=linux/amd64.

services:
  builder:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: adaptixc2-omni:latest
    container_name: adaptixc2-omni-builder
    command: ["true"]

  server:
    profiles: ["runtime"]
    image: adaptixc2-omni:latest
    container_name: adaptixc2-omni-server
    network_mode: host
    # Kharon compiles beacon + loader at runtime (Config.cc, clang++, nasm,
    # make, objcopy), so the rootfs must be writable. The entrypoint still
    # gosu's to UID 10001, capabilities are still dropped, and no-new-privs
    # still applies. On an isolated ephemeral VM, the privilege reduction
    # is sufficient — read-only rootfs was belt-and-suspenders.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN              # entrypoint normalises /app/data ownership
      - SETUID             # gosu drops privileges before exec
      - SETGID             # gosu drops privileges before exec
      - NET_BIND_SERVICE   # operator listeners often want :80 / :443 / :53
    security_opt:
      - no-new-privileges:true
    # Resource bounds — defaults sized for a generic VPS. Tune for your host:
    # mem_limit caps RSS so a runaway plugin can't OOM the host; pids_limit
    # catches fork-bomb-style misbehavior (the server itself uses well under
    # 100 threads under normal load). Override via env vars without editing
    # the file: e.g. `ADAPTIX_MEM_LIMIT=2g docker compose --profile runtime up`.
    mem_limit: ${ADAPTIX_MEM_LIMIT:-4g}
    pids_limit: ${ADAPTIX_PIDS_LIMIT:-4096}
    # Bound docker's JSON log so a misbehaving listener (or a noisy upstream
    # log line) can't fill the host disk. 30m total retention with rotation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # The runtime profile (./data/profile.yaml) is rendered by the entrypoint
      # on first start. Edit it there and `restart` to apply changes.
      - ./data:/app/data
    environment:
      - TZ=${TZ:-UTC}
      # Override credentials by uncommenting and setting before first start.
      # See README.md for ADAPTIX_OPERATORS format.
      # - ADAPTIX_TEAMSERVER_PASSWORD=
      # - ADAPTIX_OPERATORS=operator1:secret1,operator2:secret2
    restart: unless-stopped

  # Linux AppImage build. Drives one of two AdaptixC2/Dockerfile stages:
  #   amd64 → build-client       (ubuntu:22.04 + aqtinstall Qt 6.9.2 + linuxdeployqt)
  #   arm64 → build-client-kali  (kali-rolling + distro Qt 6.10.2 + linuxdeploy)
  # The arm64 path exists because aqtinstall publishes no Linux aarch64 Qt
  # binaries; Kali's distro Qt6 fills the gap. The kali stage is added by
  # patches/adaptixclient-linux-appimage.patch, which also replaces the obsolete
  # amd64 AppImageKit packaging runtime. scripts/build-client-linux.sh sets the
  # ADAPTIX_CLIENT_* variables for the selected architecture and host ownership.
  client-linux:
    profiles: ["build-client"]
    platform: ${ADAPTIX_CLIENT_PLATFORM:-linux/amd64}
    build:
      context: ./AdaptixC2
      dockerfile: Dockerfile
      target: ${ADAPTIX_CLIENT_TARGET:-build-client}
      platforms:
        - ${ADAPTIX_CLIENT_PLATFORM:-linux/amd64}
      args:
        IMG_ARCH: ${ADAPTIX_CLIENT_IMG_ARCH:-x86_64}
    image: adaptixc2-omni-client-linux-builder:${ADAPTIX_CLIENT_ARCH:-amd64}
    container_name: adaptixc2-omni-client-linux-builder-${ADAPTIX_CLIENT_ARCH:-amd64}
    # The image build runs as root, but this one-shot copy container uses the
    # invoking host identity so bind-mounted AppImages are not root-owned.
    user: "${ADAPTIX_CLIENT_HOST_UID:-1000}:${ADAPTIX_CLIENT_HOST_GID:-1000}"
    volumes:
      - ./AdaptixClient-dist:/client-dist-output
    command: sh -c "cp -r /client-dist/. /client-dist-output/"
